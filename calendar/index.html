<script>
(function(){
var themeToggle = document.getElementById('themeToggle');
var themeColorMeta = document.querySelector('meta[name="theme-color"]');
function syncThemeColor(isDark){
if(themeColorMeta) themeColorMeta.setAttribute('content', isDark ? '#0e1a30' : '#f6f3ec');
}
syncThemeColor(document.documentElement.getAttribute('data-theme') === 'dark');
themeToggle.setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
themeToggle.addEventListener('click', function(){
var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
if(isDark){
document.documentElement.removeAttribute('data-theme');
try{ localStorage.setItem('theme', 'light'); }catch(e){}
} else {
document.documentElement.setAttribute('data-theme', 'dark');
try{ localStorage.setItem('theme', 'dark'); }catch(e){}
}
syncThemeColor(!isDark);
themeToggle.setAttribute('aria-pressed', !isDark ? 'true' : 'false');
});
})();
</script>
<script>
(function(){
var CATEGORIES = ['考試','活動','假期','行政','社團','其他'];
var MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
var WEEKDAY_NAMES = ['日','一','二','三','四','五','六'];

var contentEl = document.getElementById('calendarContent');
var filterWrap = document.getElementById('filterWrap');
var sourceNote = document.getElementById('sourceNote');
var activeCategory = null;
var allEvents = [];

function escapeHtml(s){
return String(s == null ? '' : s)
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;');
}

function renderFilters(counts){
var html = '<button type="button" class="chip" data-cat="" aria-pressed="' + (activeCategory === null) + '">全部（' + counts._all + '）</button>';
CATEGORIES.forEach(function(cat){
if(!counts[cat]) return;
html += '<button type="button" class="chip" data-cat="' + cat + '" aria-pressed="' + (activeCategory === cat) + '">' + cat + '（' + counts[cat] + '）</button>';
});
filterWrap.innerHTML = html;
filterWrap.querySelectorAll('.chip').forEach(function(btn){
btn.addEventListener('click', function(){
activeCategory = btn.getAttribute('data-cat') || null;
renderFilters(counts);
renderEvents();
});
});
}

function renderEvents(){
var filtered = activeCategory ? allEvents.filter(function(e){ return e.category === activeCategory; }) : allEvents;
if(filtered.length === 0){
contentEl.innerHTML = '<div class="empty-state">這個分類目前沒有事件。</div>';
return;
}

var byDate = {};
var dateOrder = [];
filtered.forEach(function(e){
if(!byDate[e.date]){ byDate[e.date] = []; dateOrder.push(e.date); }
byDate[e.date].push(e);
});
dateOrder.sort();

var byMonth = {};
var monthOrder = [];
dateOrder.forEach(function(dateStr){
var monthKey = dateStr.slice(0, 7);
if(!byMonth[monthKey]){ byMonth[monthKey] = []; monthOrder.push(monthKey); }
byMonth[monthKey].push(dateStr);
});

var html = '';
monthOrder.forEach(function(monthKey){
var monthIdx = parseInt(monthKey.slice(5, 7), 10) - 1;
html += '<section class="month-section"><h2 class="month-title">' + MONTH_NAMES[monthIdx] + '</h2>';
byMonth[monthKey].forEach(function(dateStr){
var d = new Date(dateStr + 'T00:00:00');
var day = d.getDate();
var weekday = d.getDay();
var isWeekend = weekday === 0 || weekday === 6;
html += '<div class="day-row"><div class="day-date"><div class="day-num">' + day + '</div><div class="day-weekday' + (isWeekend ? ' is-weekend' : '') + '">週' + WEEKDAY_NAMES[weekday] + '</div></div><div class="day-events">';
byDate[dateStr].forEach(function(e){
html += '<div class="event-item"><span class="event-tag tag-' + escapeHtml(e.category) + '">' + escapeHtml(e.category) + '</span><span>' + escapeHtml(e.title) + '</span></div>';
});
html += '</div></div>';
});
html += '</section>';
});
contentEl.innerHTML = html;
}

fetch('/calendar.json')
.then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('無法載入校曆資料')); })
.then(function(data){
allEvents = (data && data.events) || [];
if(allEvents.length === 0){
contentEl.innerHTML = '<div class="empty-state">校曆資料還沒有準備好，晚點再回來看看。</div>';
return;
}
var counts = { _all: allEvents.length };
allEvents.forEach(function(e){ counts[e.category] = (counts[e.category] || 0) + 1; });
renderFilters(counts);
renderEvents();
if(data.updatedAt){
var updated = new Date(data.updatedAt);
sourceNote.textContent = '資料來源：學校官網校曆公告 PDF，最後更新於 ' + updated.toLocaleDateString('zh-TW') + '。';
}
})
.catch(function(){
contentEl.innerHTML = '<div class="error-state">校曆資料暫時載入失敗，請稍後再試，或直接查看<a href="https://www.fdhs.tyc.edu.tw" target="_blank" rel="noopener">學校官網</a>。</div>';
});
})();
</script>
