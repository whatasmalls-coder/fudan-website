<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站牌座標校正工具</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--navy:#0e1a30;--navy-dim:#16233d;--line:#2a3f63;--teal:#4fd1c5;--ink:#f4f7fb;--slate:#8b98ab;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC",sans-serif;background:var(--navy);color:var(--ink);display:flex;height:100vh;overflow:hidden;}

  #sidebar{width:340px;flex:none;background:var(--navy-dim);border-right:1px solid var(--line);display:flex;flex-direction:column;}
  #sidebar-header{padding:16px;border-bottom:1px solid var(--line);}
  #sidebar-header h1{font-size:1.05rem;margin:0 0 6px;}
  #sidebar-header p{font-size:0.78rem;color:var(--slate);margin:0;line-height:1.6;}

  #stop-list{flex:1;overflow-y:auto;}
  .stop-item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:0.85rem;}
  .stop-item:hover{background:rgba(79,209,197,0.08);}
  .stop-item.active{background:rgba(79,209,197,0.15);border-left:3px solid var(--teal);}
  .stop-item .stop-name{font-weight:700;margin-bottom:3px;}
  .stop-item .stop-coord{font-size:0.72rem;color:var(--slate);font-variant-numeric:tabular-nums;}
  .stop-item.moved .stop-coord{color:var(--teal);}
  .stop-item .moved-badge{display:inline-block;background:var(--teal);color:var(--navy);font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px;}

  #export-area{padding:16px;border-top:1px solid var(--line);}
  #export-btn{width:100%;padding:12px;background:var(--teal);color:var(--navy);border:none;border-radius:8px;font-weight:700;font-size:0.9rem;cursor:pointer;}
  #export-btn:hover{opacity:0.9;}
  #export-hint{font-size:0.72rem;color:var(--slate);margin-top:8px;line-height:1.6;}

  #map-wrap{flex:1;position:relative;}
  #map{height:100%;width:100%;}

  #output-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;padding:20px;}
  #output-modal.show{display:flex;}
  #output-box{background:var(--navy-dim);border-radius:10px;max-width:600px;width:100%;max-height:80vh;display:flex;flex-direction:column;padding:20px;}
  #output-box h2{margin:0 0 10px;font-size:1rem;}
  #output-box p{font-size:0.8rem;color:var(--slate);margin:0 0 12px;}
  #output-textarea{flex:1;background:var(--navy);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;font-size:0.78rem;resize:none;min-height:300px;}
  #output-actions{display:flex;gap:10px;margin-top:12px;}
  #output-actions button{flex:1;padding:10px;border-radius:6px;border:none;font-weight:700;cursor:pointer;font-size:0.85rem;}
  #copy-btn{background:var(--teal);color:var(--navy);}
  #close-btn{background:var(--line);color:var(--ink);}

  .leaflet-popup-content{font-family:inherit;font-size:0.85rem;}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>📍 站牌座標校正</h1>
    <p>點清單裡的站名，地圖會飛過去。<br>直接拖曳紅色圖釘到正確位置即可，改過的會標示「已調整」。</p>
  </div>
  <div id="stop-list"></div>
  <div id="export-area">
    <button id="export-btn">匯出修正後的 JSON</button>
    <div id="export-hint">匯出後複製內容，取代原本 stops-coords.json 裡對應的這幾筆資料即可。</div>
  </div>
</div>

<div id="map-wrap"><div id="map"></div></div>

<div id="output-modal">
  <div id="output-box">
    <h2>修正後的資料</h2>
    <p>複製下面內容，貼到 stops-coords.json 裡取代對應站牌的舊資料。</p>
    <textarea id="output-textarea" readonly></textarea>
    <div id="output-actions">
      <button id="copy-btn">複製全部</button>
      <button id="close-btn">關閉</button>
    </div>
  </div>
</div>

<script>
const STOPS = {
  "D024": {"name": "萬壽路三民路口(三民路14號)", "lat": 24.9925, "lng": 121.3050},
  "D116": {"name": "民光東路大業路口(民光東路260號)", "lat": 24.9945, "lng": 121.3125},
  "D120": {"name": "中山路吉林路口(中山路21號)", "lat": 25.0420, "lng": 121.2900},
  "D131": {"name": "忠孝西路奉化路口(忠孝西路203號)", "lat": 25.0360, "lng": 121.2860},
  "D130": {"name": "忠孝西路南福街口(光明國小公車站)", "lat": 25.0380, "lng": 121.2880},
  "C051": {"name": "領航南路青雲路口(全家中壢青雲店)對面", "lat": 24.9900, "lng": 121.2210},
  "C072": {"name": "領航南路青埔路口(領航南路二段289號)", "lat": 24.9880, "lng": 121.2170},
  "D030": {"name": "介壽路永福西街口(介壽路一段796號)", "lat": 24.9580, "lng": 121.2900},
  "D010": {"name": "同和路金和路口(金和路93號)", "lat": 24.9600, "lng": 121.2860},
  "C010": {"name": "長興二路長興路口(旁路口公園)", "lat": 24.9650, "lng": 121.2840},
  "B095": {"name": "華勛消防局(對面上車)", "lat": 24.9280, "lng": 121.2330},
  "B105": {"name": "中壢區星球幼稚園(華勛國小)公車站", "lat": 24.9300, "lng": 121.2350},
  "A047": {"name": "新榮路振興西路口(振興西路57號)", "lat": 24.9580, "lng": 121.2300},
  "B035": {"name": "自強幼稚園", "lat": 24.9400, "lng": 121.2420},
  "B021": {"name": "龍岡橋郵局", "lat": 24.9380, "lng": 121.2380},
  "D006": {"name": "逸光幼稚園(石園二村公車站旁遮雨棚)", "lat": 24.8550, "lng": 121.2080},
  "C015": {"name": "龍吟別莊(公車站)", "lat": 24.8580, "lng": 121.2110},
  "C137": {"name": "龍潭國泰大樓(1)(國中部)", "lat": 24.8635, "lng": 121.2145},
  "C020": {"name": "喜多照相館(原富士)", "lat": 24.8590, "lng": 121.2130},
  "B124": {"name": "平東路金陵路(7-11-金陵路四段485號)", "lat": 24.9300, "lng": 121.2030},
  "C005": {"name": "龍潭國泰大樓(2)(高中部)", "lat": 24.8635, "lng": 121.2145},
  "C036": {"name": "八張犛(過湧光路口路邊檳榔攤)", "lat": 24.8698, "lng": 121.2113},
  "C111": {"name": "龍潭寶雅生活館(1)", "lat": 24.8637, "lng": 121.2143},
  "A007": {"name": "金陵路和平路口(7-11超商-金陵路78號)", "lat": 24.9395, "lng": 121.2135},
  "A006": {"name": "金陵路振興路口(金陵路206號)", "lat": 24.9360, "lng": 121.2110},
  "A036": {"name": "大統別莊(公車站)", "lat": 24.9350, "lng": 121.2070},
  "A019": {"name": "米堤飯店(捷運老街溪站-中央西路)公車站", "lat": 24.9737, "lng": 121.2280},
  "B119": {"name": "南園二路新生路口(新生路629號)", "lat": 24.9633, "lng": 121.2270},
  "B008": {"name": "南園二路華夏路口(全家)", "lat": 24.9636, "lng": 121.2258},
  "C135": {"name": "領航北路永信路口(清心福全)(1)(永信路203號)", "lat": 25.0060, "lng": 121.2220},
  "C107": {"name": "文康路民權路口(環球停車場出口旁)", "lat": 25.0508, "lng": 121.3016},
  "C134": {"name": "領航北路青昇路口(土地公廟路旁)", "lat": 25.0050, "lng": 121.2200},
  "B066": {"name": "新生路領航南路口(楓康超市對面新生路旁)", "lat": 24.9905, "lng": 121.2168},
  "D011": {"name": "統一公司(頂湖公車站)", "lat": 24.8650, "lng": 121.2020},
  "C127": {"name": "新農街三民北路口(7-11-三民北路177號)", "lat": 24.9155, "lng": 121.1467},
  "C064": {"name": "上下大崛路口", "lat": 24.9650, "lng": 121.1900}
};

const map = L.map('map').setView([24.95, 121.22], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};
const movedCodes = new Set();
const listEl = document.getElementById('stop-list');

function makeListItem(code, data){
  const item = document.createElement('div');
  item.className = 'stop-item';
  item.id = 'item-' + code;
  item.innerHTML = `<div class="stop-name">${data.name}<span class="moved-badge" style="display:none;">已調整</span></div><div class="stop-coord">${data.lat.toFixed(6)}, ${data.lng.toFixed(6)}</div>`;
  item.addEventListener('click', () => {
    map.flyTo([data.lat, data.lng], 17);
    markers[code].openPopup();
    document.querySelectorAll('.stop-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
  });
  return item;
}

Object.entries(STOPS).forEach(([code, data]) => {
  const marker = L.marker([data.lat, data.lng], { draggable: true }).addTo(map);
  marker.bindPopup(`<b>${data.name}</b><br>代碼：${code}`);
  marker.on('dragend', () => {
    const pos = marker.getLatLng();
    STOPS[code].lat = pos.lat;
    STOPS[code].lng = pos.lng;
    movedCodes.add(code);
    const item = document.getElementById('item-' + code);
    item.classList.add('moved');
    item.querySelector('.moved-badge').style.display = '';
    item.querySelector('.stop-coord').textContent = pos.lat.toFixed(6) + ', ' + pos.lng.toFixed(6);
  });
  markers[code] = marker;
  listEl.appendChild(makeListItem(code, data));
});

document.getElementById('export-btn').addEventListener('click', () => {
  const lines = Object.entries(STOPS).map(([code, data]) => {
    return `  "${code}": {"name": "${data.name.replace(/"/g,'\\"')}", "lat": ${data.lat}, "lng": ${data.lng}}`;
  });
  const output = lines.join(',\n');
  document.getElementById('output-textarea').value = output;
  document.getElementById('output-modal').classList.add('show');
});

document.getElementById('close-btn').addEventListener('click', () => {
  document.getElementById('output-modal').classList.remove('show');
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const textarea = document.getElementById('output-textarea');
  textarea.select();
  navigator.clipboard.writeText(textarea.value).then(() => {
    const btn = document.getElementById('copy-btn');
    const original = btn.textContent;
    btn.textContent = '已複製！';
    setTimeout(() => { btn.textContent = original; }, 1500);
  }).catch(() => {
    document.execCommand('copy');
  });
});
</script>
</body>
</html>
