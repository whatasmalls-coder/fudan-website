  @font-face{font-family:'Noto Sans TC Fallback';src:local('PingFang TC'),local('Microsoft JhengHei'),local('Noto Sans CJK TC'),local('Heiti TC');ascent-override:88%;descent-override:12%;line-gap-override:0%}
  :root{
    --navy-deep:#0e1a30; --navy:#16274a; --dawn:#d4a24c; --dawn-text:#8f6424;
    --paper:#f6f3ec; --paper-dim:#eae5d8; --ink:#20242e; --slate:#5a6072; --line:rgba(20,30,55,0.12);
    --ok:#1a7a3a; --ok-bg:#e6f4ea; --err:#b3392f; --err-bg:#fbe7e6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Noto Sans TC Fallback',sans-serif;line-height:1.7;}
  header{background:var(--navy-deep);color:#fff;padding:28px 24px;}
  header h1{margin:0 0 6px;font-size:1.3rem;}
  header p{margin:0;color:rgba(255,255,255,0.7);font-size:0.85rem;}
  main{max-width:760px;margin:0 auto;padding:28px 20px 100px;}
  .box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:24px;}
  .box[hidden]{display:none;}
  .box h2{margin:0 0 8px;font-size:1.05rem;color:var(--navy);}
  .hint{font-size:0.86rem;color:var(--slate);line-height:1.8;margin:0 0 16px;}
  .who{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:0.86rem;color:var(--slate);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .who b{color:var(--navy);}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 18px;border-radius:4px;border:none;cursor:pointer;font-size:0.9rem;font-weight:600;font-family:inherit;}
  .btn-primary{background:var(--dawn);color:var(--navy-deep);}
  .btn-primary:hover{background:#e0b562;}
  .btn-ghost{background:var(--paper-dim);color:var(--navy);}
  .btn-ghost:hover{background:#dcd5c2;}
  .btn-danger{background:#fff;color:var(--err);border:1px solid #e7b5b0;}
  .btn-sm{min-height:34px;padding:6px 12px;font-size:0.82rem;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn:focus-visible,input:focus-visible{outline:3px solid var(--dawn);outline-offset:2px;}
  .status{margin:14px 0 0;font-size:0.9rem;padding:10px 14px;border-radius:4px;}
  .status[hidden]{display:none;}
  .status.ok{background:var(--ok-bg);color:var(--ok);}
  .status.err{background:var(--err-bg);color:var(--err);}
  .status.info{background:var(--paper-dim);color:var(--slate);}
  .badge{display:inline-block;margin-left:8px;font-size:0.78rem;font-weight:700;color:var(--err);background:var(--err-bg);padding:2px 9px;border-radius:10px;vertical-align:middle;}
  .badge[hidden]{display:none;}
  .item{border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px;background:var(--paper);}
  .grid{display:grid;grid-template-columns:130px 110px 1fr;gap:10px;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .field span{font-size:0.78rem;font-weight:600;color:var(--navy);}
  .field input{width:100%;padding:9px 10px;border:1px solid #cfc8b6;border-radius:3px;font-size:0.92rem;background:#fff;color:var(--ink);}
  .link-field{margin-top:10px;}
  .row-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap;}
  hr{margin:24px 0;border:none;border-top:1px solid var(--line);}
  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
    main{padding:20px 16px 100px;}
    .box{padding:18px;}
  }
</style>

  function setStatus(msg, type){
    var el = $('status');
    el.textContent = msg || '';
    el.className = 'status ' + (type || '');
    el.hidden = !msg;
  }
  function setLoginNotice(msg){
    var el = $('loginNotice');
    el.textContent = msg || '';
    el.hidden = !msg;
  }
  function setDirty(v){
    dirty = v;
    $('dirtyBadge').hidden = !v;
  }
  window.addEventListener('beforeunload', function(e){
    if(dirty){ e.preventDefault(); e.returnValue = ''; }
  });

  function today(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
  }

  function api(method, body){
    var headers = { 'Authorization': 'Bearer ' + idToken };
    if(body) headers['Content-Type'] = 'application/json';
    return fetch(ADMIN_API + '/news', {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        if(!res.ok){
          var err = new Error(data.error || ('發生錯誤（' + res.status + '）'));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  // ===== 登入 =====
  function renderGoogleButtons(){
    if(!(window.google && google.accounts && google.accounts.id)) return false;
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential });
    ['gBtn', 'gBtn2'].forEach(function(id){
      $(id).innerHTML = '';
      google.accounts.id.renderButton($(id), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' });
    });
    return true;
  }

  function onCredential(resp){
    idToken = resp.credential;
    setLoginNotice('');
    if(pendingRetry){
      var retry = pendingRetry;
      pendingRetry = null;
      $('reauthBox').hidden = true;
      retry();
    }else{
      loadNews();
    }
  }

  function showLogin(msg){
    idToken = null;
    sha = null;
    $('editorBox').hidden = true;
    $('loginBox').hidden = false;
    setLoginNotice(msg || '');
  }

  function signOut(){
    if(dirty && !window.confirm('還有尚未儲存的修改，確定要登出嗎？')) return;
    if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    $('items').innerHTML = '';
    setDirty(false);
    setStatus('');
    showLogin('已登出。');
  }

  // ===== 載入與渲染 =====
  function loadNews(){
    setLoginNotice('');
    api('GET').then(function(data){
      sha = data.sha;
      $('whoEmail').textContent = data.email;
      $('items').innerHTML = '';
      data.items.forEach(function(it){ addRow(it, false); });
      $('loginBox').hidden = true;
      $('editorBox').hidden = false;
      setDirty(false);
      setStatus('');
    }).catch(function(err){
      if(err.status === 401){
        showLogin('登入已過期，請重新登入。');
      }else if(err.status === 403){
        showLogin(err.message);
      }else{
        showLogin('載入失敗：' + err.message);
      }
    });
  }

  function addRow(item, atTop){
    item = item || { date: today(), tag: '', title: '', link: DEFAULT_LINK };
    var row = document.createElement('div');
    row.className = 'item';
    // 沒有在表單上的欄位（例如 AI 摘要）原樣保留，儲存時一起送出
    row._extra = {};
    ['summary', 'seoDescription'].forEach(function(k){
      if(item[k]) row._extra[k] = item[k];
    });

    var grid = document.createElement('div');
    grid.className = 'grid';
    grid.appendChild(makeField('日期', 'date', item.date || '', '2026.08.01'));
    grid.appendChild(makeField('分類', 'tag', item.tag || '', '例如 招生', 'tagList'));
    grid.appendChild(makeField('標題', 'title', item.title || '', '公告標題'));
    row.appendChild(grid);

    var linkWrap = makeField('連結網址', 'link', item.link || DEFAULT_LINK, 'https://');
    linkWrap.classList.add('link-field');
    row.appendChild(linkWrap);

    var actions = document.createElement('div');
    actions.className = 'row-actions';
    actions.appendChild(makeBtn('↑ 上移', 'btn btn-ghost btn-sm', function(){
      var prev = row.previousElementSibling;
      if(prev){ row.parentNode.insertBefore(row, prev); setDirty(true); }
    }));
    actions.appendChild(makeBtn('↓ 下移', 'btn btn-ghost btn-sm', function(){
      var next = row.nextElementSibling;
      if(next){ row.parentNode.insertBefore(next, row); setDirty(true); }
    }));
    actions.appendChild(makeBtn('刪除', 'btn btn-danger btn-sm', function(){
      var title = row.querySelector('[data-k="title"]').value.trim();
      var label = title ? '「' + title + '」' : '這一則消息';
      if(window.confirm('確定要刪除' + label + '嗎？\n（要按下「儲存」之後才會真的從網站移除）')){
        row.remove();
        setDirty(true);
      }
    }));
    row.appendChild(actions);

    row.querySelectorAll('input').forEach(function(inp){
      inp.addEventListener('input', function(){ setDirty(true); });
    });

    var list = $('items');
    if(atTop && list.firstChild){ list.insertBefore(row, list.firstChild); }
    else { list.appendChild(row); }
    return row;
  }

  function makeField(label, key, value, placeholder, listId){
    var wrap = document.createElement('label');
    wrap.className = 'field';
    var span = document.createElement('span');
    span.textContent = label;
    var input = document.createElement('input');
    input.type = key === 'link' ? 'url' : 'text';
    input.value = value;
    input.placeholder = placeholder;
    input.setAttribute('data-k', key);
    input.autocomplete = 'off';
    if(listId) input.setAttribute('list', listId);
    wrap.appendChild(span);
    wrap.appendChild(input);
    return wrap;
  }

  function makeBtn(text, cls, fn){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.textContent = text;
    b.addEventListener('click', fn);
    return b;
  }

  function collect(){
    var rows = $('items').querySelectorAll('.item');
    var out = [];
    rows.forEach(function(row){
      var get = function(k){ return row.querySelector('[data-k="' + k + '"]').value.trim(); };
      var item = { date: get('date'), tag: get('tag'), title: get('title'), link: get('link') };
      Object.keys(row._extra).forEach(function(k){ item[k] = row._extra[k]; });
      out.push(item);
    });
    return out;
  }

  // ===== 儲存 =====
  function save(){
    if(!idToken){
      setStatus('請先登入再儲存。', 'err');
      return;
    }
    var items = collect();
    if(items.length === 0){
      setStatus('至少需要保留一則消息。', 'err');
      return;
    }
    var saveBtn = $('saveBtn');
    saveBtn.disabled = true;
    setStatus('儲存中…', 'info');

    api('PUT', { items: items, sha: sha }).then(function(data){
      sha = data.sha;
      setDirty(false);
      setStatus('✓ 已儲存。網站約 1–2 分鐘後更新，重新整理首頁即可看到。', 'ok');
    }).catch(function(err){
      if(err.status === 401){
        // 內容保留在畫面上，請使用者重新登入後自動再存一次
        pendingRetry = save;
        $('reauthBox').hidden = false;
        setStatus('登入已過期，內容還在，請用下方按鈕重新登入。', 'err');
        if(!renderGoogleButtons()) setStatus('登入元件尚未載入，請重新整理頁面。', 'err');
      }else if(err.status === 409){
        setStatus(err.message + '（你的修改還在畫面上，可先複製起來，再重新整理後貼回去）', 'err');
      }else{
        setStatus('儲存失敗：' + err.message, 'err');
      }
    }).finally(function(){
      saveBtn.disabled = false;
    });
  }

  // ===== 初始化 =====
  $('addBtn').addEventListener('click', function(){
    addRow(null, true);
    setDirty(true);
  });
  $('saveBtn').addEventListener('click', save);
  $('signOutBtn').addEventListener('click', signOut);

  if(!configured){
    setLoginNotice('後台尚未完成設定，請聯絡管理者。');
    $('gBtn').hidden = true;
    return;
  }
  (function waitForGoogle(tries){
    if(renderGoogleButtons()) return;
    if(tries > 50){ setLoginNotice('登入元件載入失敗，請重新整理頁面。'); return; }
    setTimeout(function(){ waitForGoogle(tries + 1); }, 200);
  })(0);
})();
</script>
</body>
</html>
