  @font-face{font-family:'Noto Sans TC Fallback';src:local('PingFang TC'),local('Microsoft JhengHei'),local('Noto Sans CJK TC'),local('Heiti TC');ascent-override:88%;descent-override:12%;line-gap-override:0%}
  :root{
    --navy-deep:#0e1a30; --navy:#16274a; --dawn:#d4a24c; --dawn-hi:#e0b562; --dawn-text:#8f6424;
    --paper:#f4f1ea; --card:#ffffff; --ink:#1f2330; --slate:#5d6374; --line:#e3ddcf; --line-strong:#cfc7b3;
    --ok:#17703a; --ok-bg:#e5f3ea; --err:#b03a2e; --err-bg:#fbe9e7; --info-bg:#eef0f5;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Noto Sans TC Fallback',sans-serif;line-height:1.7;min-height:100vh;}
  [hidden]{display:none !important;}

  /* 頂部列 */
  .top{background:var(--navy-deep);color:#fff;}
  .top-inner{max-width:820px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .mark{width:40px;height:40px;display:block;flex:none;}
  .brand b{display:block;font-size:1rem;letter-spacing:.02em;}
  .brand small{display:block;color:rgba(255,255,255,.66);font-size:.76rem;line-height:1.3;}
  .who{display:flex;align-items:center;gap:10px;font-size:.8rem;color:rgba(255,255,255,.8);min-width:0;}
  .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;}

  main{max-width:820px;margin:0 auto;padding:28px 20px 160px;}

  /* 按鈕 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 18px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-size:.92rem;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;text-decoration:none;}
  .btn-primary{background:var(--dawn);color:var(--navy-deep);}
  .btn-primary:hover:not(:disabled){background:var(--dawn-hi);}
  .btn-ghost{background:#fff;color:var(--navy);border-color:var(--line-strong);}
  .btn-ghost:hover:not(:disabled){background:#f8f6f0;border-color:var(--navy);}
  .btn-danger{background:#fff;color:var(--err);border-color:#e7b9b3;}
  .btn-danger:hover:not(:disabled){background:var(--err-bg);}
  .btn-sm{min-height:34px;padding:5px 12px;font-size:.82rem;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible,input:focus-visible,.gbtn:focus-within{outline:3px solid var(--dawn);outline-offset:2px;}

  /* 登入卡 */
  .login-card{max-width:420px;margin:48px auto 0;background:var(--card);border-radius:16px;padding:36px 28px 28px;box-shadow:0 12px 40px rgba(14,26,48,.10);text-align:center;}
  .login-mark{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:var(--navy-deep);padding:14px;display:block;box-shadow:0 8px 20px rgba(14,26,48,.28);box-sizing:border-box;}
  .login-foot{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--slate);line-height:1.7;}
  .login-card h1{margin:0 0 8px;font-size:1.25rem;color:var(--navy);}
  .hint{font-size:.88rem;color:var(--slate);line-height:1.8;margin:0;}
  .gbtn{display:flex;justify-content:center;min-height:44px;margin:24px 0 8px;}
  .notice{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;font-size:.9rem;padding:12px 14px;border-radius:12px;background:var(--info-bg);color:var(--slate);text-align:left;line-height:1.6;}
  .notice::before{content:"ⓘ";flex:none;font-weight:700;color:var(--navy);}
  .notice.err{background:var(--err-bg);color:var(--err);}
  .notice.err::before{content:"!";width:18px;height:18px;border-radius:50%;background:var(--err);color:#fff;display:grid;place-items:center;font-size:.75rem;margin-top:2px;}

  /* 編輯區 */
  .toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .toolbar h1{margin:0;font-size:1.4rem;color:var(--navy);line-height:1.3;}
  .toolbar .hint{margin-top:4px;}
  .toolbar-actions{display:flex;gap:8px;}
  .tip{margin:14px 0 18px;padding:10px 14px;border-radius:10px;background:var(--info-bg);font-size:.84rem;}

  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(14,26,48,.04);}
  .item.is-dirty{border-color:var(--dawn);}
  .item-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-width:0;}
  .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;}
  .item-preview{flex:1;min-width:0;font-weight:600;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem;}
  .item-preview.empty{color:#9a9fae;font-weight:500;}
  .grid{display:grid;grid-template-columns:140px 120px 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .field span{font-size:.76rem;font-weight:600;color:var(--slate);letter-spacing:.02em;}
  .field input{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:.93rem;background:#fff;color:var(--ink);}
  .field input:hover{border-color:var(--slate);}
  .field input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(212,162,76,.28);}
  .field.wide{grid-column:1 / -1;}
  .item-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap;}
  .move{display:flex;gap:6px;}
  .empty-state{text-align:center;padding:36px 16px;color:var(--slate);background:var(--card);border:1px dashed var(--line-strong);border-radius:14px;margin-bottom:12px;}
  .add-wrap{margin:8px 0 0;}

  /* 底部存檔列 */
  .savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(14,26,48,.08);z-index:10;padding:12px 20px calc(12px + env(safe-area-inset-bottom));}
  .savebar-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .savestate{font-size:.88rem;color:var(--slate);display:flex;align-items:center;gap:8px;min-width:0;}
  .dot{width:8px;height:8px;border-radius:50%;background:#2fa058;flex:none;}
  .savestate.dirty .dot{background:var(--dawn);}
  .savestate.dirty{color:var(--dawn-text);font-weight:600;}
  .status{max-width:820px;margin:8px auto 0;font-size:.88rem;padding:8px 12px;border-radius:10px;}
  .status.ok{background:var(--ok-bg);color:var(--ok);}
  .status.err{background:var(--err-bg);color:var(--err);}
  .status.info{background:var(--info-bg);color:var(--slate);}

  .reauth{margin-top:16px;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line-strong);text-align:center;}
  .reauth p{margin:0 0 8px;font-size:.9rem;}

  @media (max-width:640px){
    .top-inner{padding:14px 16px;}
    .who span{display:none;}
    main{padding:20px 16px 170px;}
    .login-card{margin-top:28px;padding:28px 20px 22px;}
    .grid{grid-template-columns:1fr 1fr;}
    .grid .field:nth-child(3){grid-column:1 / -1;}
    .savebar{padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
    .savestate{font-size:.82rem;}
    .btn-primary{padding:9px 16px;}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr;}
    .grid .field:nth-child(3){grid-column:auto;}
  }
</style>
</head>

      <div class="toolbar-actions">
        <a class="btn btn-ghost btn-sm" href="https://www.visitfudan.com/" target="_blank" rel="noopener">查看首頁 ↗</a>
        <button class="btn btn-ghost btn-sm" id="addBtn" type="button">＋ 新增一則</button>
      </div>
    </div>
    <p class="tip hint">最上面的會顯示在網站最前面。用 ↑ ↓ 調整順序，刪除前會再確認一次。</p>
    <div id="items"></div>
    <div class="reauth" id="reauthBox" hidden>
      <p>登入已過期，你的內容還在畫面上。</p>
      <div id="gBtn2" class="gbtn"></div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar" hidden>
  <p class="status" id="status" role="status" hidden></p>
  <div class="savebar-inner">
    <span class="savestate" id="savestate"><span class="dot"></span><span id="savestateText">所有修改已儲存</span></span>
    <button class="btn btn-primary" id="saveBtn" type="button">儲存並發布</button>
  </div>
</div>

<datalist id="tagList">
  <option value="招生"></option><option value="校車"></option><option value="獎助學金"></option>
  <option value="競賽"></option><option value="研習"></option><option value="榮譽"></option>
  <option value="行政"></option><option value="防疫"></option><option value="防災"></option>
  <option value="活動"></option><option value="轉知"></option>
</datalist>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  // ===== 設定（部署 Worker 與 Google 登入後填入）=====
  var ADMIN_API = 'https://fudan-admin.whatasmalls.workers.dev';
  var GOOGLE_CLIENT_ID = '388099721540-sjbr1j4ijuh1k9eobchld542jobt1kn9.apps.googleusercontent.com';
  var DEFAULT_LINK = 'https://www.fdhs.tyc.edu.tw';
  // =================================================

  var idToken = null;   // 只放在記憶體，不存進 localStorage，關閉分頁就消失
  var sha = null;
  var dirty = false;
  var pendingRetry = null;
  var configured = GOOGLE_CLIENT_ID.indexOf('REPLACE_') !== 0;

  function $(id){ return document.getElementById(id); }

  function setStatus(msg, type){
    var el = $('status');
    el.textContent = msg || '';
    el.className = 'status ' + (type || '');
    el.hidden = !msg;
  }
  function setLoginNotice(msg, isErr){
    var el = $('loginNotice');
    el.textContent = msg || '';
    el.className = 'notice' + (isErr ? ' err' : '');
    el.hidden = !msg;
  }
  function setDirty(v){
    dirty = v;
    var st = $('savestate');
    st.classList.toggle('dirty', v);
    $('savestateText').textContent = v ? '有尚未儲存的修改' : '所有修改已儲存';
  }
  function showEditor(on){
    $('loginBox').hidden = on;
    $('editorBox').hidden = !on;
    $('savebar').hidden = !on;
    $('who').hidden = !on;
  }
  function updateCount(){
    var n = $('items').querySelectorAll('.item').length;
    $('countText').textContent = '目前共 ' + n + ' 則，網站會顯示最上面的前 30 則。';
    var empty = $('emptyState');
    if(empty) empty.hidden = n > 0;
  }
  function renumber(){
    var rows = $('items').querySelectorAll('.item');
    rows.forEach(function(row, i){
      row.querySelector('.num').textContent = i + 1;
    });
    updateCount();
  }

  window.addEventListener('beforeunload', function(e){
    if(dirty){ e.preventDefault(); e.returnValue = ''; }
  });

  function today(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
  }

  function api(method, body){
    var headers = { 'Authorization': 'Bearer ' + idToken };
    if(body) headers['Content-Type'] = 'application/json';
    return fetch(ADMIN_API + '/news', {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        if(!res.ok){
          var err = new Error(data.error || ('發生錯誤（' + res.status + '）'));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  // ===== 登入 =====
  function renderGoogleButtons(){
    if(!(window.google && google.accounts && google.accounts.id)) return false;
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential });
    ['gBtn', 'gBtn2'].forEach(function(id){
      $(id).innerHTML = '';
      google.accounts.id.renderButton($(id), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW', shape: 'pill' });
    });
    return true;
  }

  function onCredential(resp){
    idToken = resp.credential;
    setLoginNotice('');
    if(pendingRetry){
      var retry = pendingRetry;
      pendingRetry = null;
      $('reauthBox').hidden = true;
      retry();
    }else{
      loadNews();
    }
  }

  function showLogin(msg, isErr){
    idToken = null;
    sha = null;
    showEditor(false);
    setLoginNotice(msg || '', isErr);
    renderGoogleButtons();
  }

  function signOut(){
    if(dirty && !window.confirm('還有尚未儲存的修改，確定要登出嗎？')) return;
    if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    $('items').innerHTML = '';
    setDirty(false);
    setStatus('');
    showLogin('已登出。');
  }

  // ===== 載入與渲染 =====
  function loadNews(){
    setLoginNotice('');
    api('GET').then(function(data){
      sha = data.sha;
      $('whoEmail').textContent = data.email;
      $('items').innerHTML = '';
      data.items.forEach(function(it){ addRow(it, false); });
      renumber();
      showEditor(true);
      setDirty(false);
      setStatus('');
    }).catch(function(err){
      if(err.status === 401){
        showLogin('登入已過期，請重新登入。', true);
      }else if(err.status === 403){
        showLogin(err.message, true);
      }else{
        showLogin(err.status === 503
          ? '後台暫時無法使用，請稍後再試；若持續發生，請聯絡管理者。'
          : '載入失敗：' + err.message, true);
      }
    });
  }

  function addRow(item, atTop){
    item = item || { date: today(), tag: '', title: '', link: DEFAULT_LINK };
    var row = document.createElement('div');
    row.className = 'item';
    // 沒有在表單上的欄位（例如 AI 摘要）原樣保留，儲存時一起送出
    row._extra = {};
    ['summary', 'seoDescription'].forEach(function(k){
      if(item[k]) row._extra[k] = item[k];
    });

    // 標題列：序號 + 標題預覽
    var head = document.createElement('div');
    head.className = 'item-head';
    var num = document.createElement('span');
    num.className = 'num';
    var preview = document.createElement('span');
    preview.className = 'item-preview';
    head.appendChild(num);
    head.appendChild(preview);
    row.appendChild(head);

    var grid = document.createElement('div');
    grid.className = 'grid';
    grid.appendChild(makeField('日期', 'date', item.date || '', '2026.08.01'));
    grid.appendChild(makeField('分類', 'tag', item.tag || '', '例如 招生', 'tagList'));
    grid.appendChild(makeField('標題', 'title', item.title || '', '公告標題'));
    grid.appendChild(makeField('連結網址', 'link', item.link || DEFAULT_LINK, 'https://', null, 'wide'));
    row.appendChild(grid);

    var foot = document.createElement('div');
    foot.className = 'item-foot';
    var move = document.createElement('div');
    move.className = 'move';
    move.appendChild(makeBtn('↑ 上移', 'btn btn-ghost btn-sm', function(){
      var prev = row.previousElementSibling;
      if(prev){ row.parentNode.insertBefore(row, prev); renumber(); setDirty(true); }
    }));
    move.appendChild(makeBtn('↓ 下移', 'btn btn-ghost btn-sm', function(){
      var next = row.nextElementSibling;
      if(next){ row.parentNode.insertBefore(next, row); renumber(); setDirty(true); }
    }));
    foot.appendChild(move);
    foot.appendChild(makeBtn('刪除', 'btn btn-danger btn-sm', function(){
      var title = row.querySelector('[data-k="title"]').value.trim();
      var label = title ? '「' + title + '」' : '這一則消息';
      if(window.confirm('確定要刪除' + label + '嗎？\n（要按下「儲存並發布」之後才會真的從網站移除）')){
        row.remove();
        renumber();
        setDirty(true);
      }
    }));
    row.appendChild(foot);

    function syncPreview(){
      var t = row.querySelector('[data-k="title"]').value.trim();
      preview.textContent = t || '（尚未填寫標題）';
      preview.classList.toggle('empty', !t);
    }
    syncPreview();

    row.querySelectorAll('input').forEach(function(inp){
      inp.addEventListener('input', function(){
        row.classList.add('is-dirty');
        syncPreview();
        setDirty(true);
      });
    });

    var list = $('items');
    if(atTop && list.firstChild){ list.insertBefore(row, list.firstChild); }
    else { list.appendChild(row); }
    return row;
  }

  function makeField(label, key, value, placeholder, listId, extraClass){
    var wrap = document.createElement('label');
    wrap.className = 'field' + (extraClass ? ' ' + extraClass : '');
    var span = document.createElement('span');
    span.textContent = label;
    var input = document.createElement('input');
    input.type = key === 'link' ? 'url' : 'text';
    input.value = value;
    input.placeholder = placeholder;
    input.setAttribute('data-k', key);
    input.autocomplete = 'off';
    if(listId) input.setAttribute('list', listId);
    wrap.appendChild(span);
    wrap.appendChild(input);
    return wrap;
  }

  function makeBtn(text, cls, fn){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.textContent = text;
    b.addEventListener('click', fn);
    return b;
  }

  function collect(){
    var rows = $('items').querySelectorAll('.item');
    var out = [];
    rows.forEach(function(row){
      var get = function(k){ return row.querySelector('[data-k="' + k + '"]').value.trim(); };
      var item = { date: get('date'), tag: get('tag'), title: get('title'), link: get('link') };
      Object.keys(row._extra).forEach(function(k){ item[k] = row._extra[k]; });
      out.push(item);
    });
    return out;
  }

  // ===== 儲存 =====
  function save(){
    if(!idToken){
      setStatus('請先登入再儲存。', 'err');
      return;
    }
    var items = collect();
    if(items.length === 0){
      setStatus('至少需要保留一則消息。', 'err');
      return;
    }
    var saveBtn = $('saveBtn');
    saveBtn.disabled = true;
    setStatus('儲存中…', 'info');

    api('PUT', { items: items, sha: sha }).then(function(data){
      sha = data.sha;
      setDirty(false);
      $('items').querySelectorAll('.item.is-dirty').forEach(function(r){ r.classList.remove('is-dirty'); });
      setStatus('✓ 已儲存。網站約 1–2 分鐘後更新，重新整理首頁即可看到。', 'ok');
    }).catch(function(err){
      if(err.status === 401){
        // 內容保留在畫面上，請使用者重新登入後自動再存一次
        pendingRetry = save;
        $('reauthBox').hidden = false;
        setStatus('登入已過期，請用下方按鈕重新登入。', 'err');
        if(!renderGoogleButtons()) setStatus('登入元件尚未載入，請重新整理頁面。', 'err');
      }else if(err.status === 409){
        setStatus(err.message + '（你的修改還在畫面上，可先複製起來，再重新整理後貼回去）', 'err');
      }else{
        setStatus('儲存失敗：' + err.message, 'err');
      }
    }).finally(function(){
      saveBtn.disabled = false;
    });
  }

  // ===== 初始化 =====
  $('addBtn').addEventListener('click', function(){
    addRow(null, true);
    renumber();
    setDirty(true);
    var first = $('items').querySelector('.item input[data-k="title"]');
    if(first) first.focus();
  });
  $('saveBtn').addEventListener('click', save);
  $('signOutBtn').addEventListener('click', signOut);

  // 沒有 items 時的空狀態（只在編輯區開啟時有意義）
  (function(){
    var empty = document.createElement('div');
    empty.id = 'emptyState';
    empty.className = 'empty-state';
    empty.hidden = true;
    empty.textContent = '目前沒有消息，按上方「＋ 新增一則」開始。';
    $('items').parentNode.insertBefore(empty, $('items'));
  })();

  if(!configured){
    setLoginNotice('後台尚未完成設定，請聯絡管理者。', true);
    $('gBtn').hidden = true;
    return;
  }
  (function waitForGoogle(tries){
    if(renderGoogleButtons()) return;
    if(tries > 50){ setLoginNotice('登入元件載入失敗，請重新整理頁面。', true); return; }
    setTimeout(function(){ waitForGoogle(tries + 1); }, 200);
  })(0);
})();
</script>
</body>
</html>
