<script>
(async function(){
var ROUTES = await fetch('/js/routes.json').then(function(r){ return r.json(); });
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var statTotal = document.getElementById('statTotal');
var statStops = document.getElementById('statStops');
var totalStops = ROUTES.reduce(function(sum,r){ return sum + r.stops.length; }, 0);
statTotal.textContent = ROUTES.length;
statStops.textContent = totalStops;

/* ---- Fuse.js 索引：把每個站點攤平成一筆，帶上所屬路線資訊 ---- */
var flatStops = [];
ROUTES.forEach(function(route){
route.stops.forEach(function(stop){
flatStops.push({
routeNo: route.no,
routeName: route.name,
code: stop.code,
time: stop.time,
name: stop.name
});
});
});

var stopFuse = new Fuse(flatStops, {
keys: [
{ name: 'name', weight: 0.6 },
{ name: 'routeName', weight: 0.3 },
{ name: 'code', weight: 0.1 }
],
threshold: 0.38,
ignoreLocation: true,
includeScore: true,
includeMatches: true,
minMatchCharLength: 1
});

var routeFuse = new Fuse(ROUTES, {
keys: ['name'],
threshold: 0.3,
includeScore: true
});

var input = document.getElementById('searchInput');
var btn = document.getElementById('searchBtn');
var resultList = document.getElementById('resultList');
var resultCount = document.getElementById('resultCount');

function escapeHtml(s){
return s.replace(/[&<>"']/g, function(c){
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
});
}

function highlight(text, query){
if(!query) return escapeHtml(text);
var idx = text.indexOf(query);
if(idx === -1) return escapeHtml(text);
return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+query.length)) + '</mark>' + escapeHtml(text.slice(idx+query.length));
}

/* ---- 找我附近的站：用瀏覽器定位 + 站牌座標，算出離使用者最近的幾個站牌 ---- */
var NEAR_ME_COORDS_URL = '/js/stops-coords.json';
var stopsCoordsCache = null;
var nearMeBtn = document.getElementById('nearMeBtn');
var nearMeStatus = document.getElementById('nearMeStatus');

function loadStopsCoords(){
if(stopsCoordsCache) return Promise.resolve(stopsCoordsCache);
return fetch(NEAR_ME_COORDS_URL).then(function(r){
if(!r.ok) throw new Error('座標資料不存在');
return r.json();
}).then(function(data){ stopsCoordsCache = data; return data; });
}

/* 用 Haversine 公式計算兩個經緯度之間的直線距離（公尺） */
function haversineDistance(lat1, lng1, lat2, lng2){
var R = 6371000;
var toRad = function(d){ return d * Math.PI / 180; };
var dLat = toRad(lat2 - lat1);
var dLng = toRad(lng2 - lng1);
var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) * Math.sin(dLng/2);
var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
return R * c;
}

function setNearMeStatus(text, isError){
if(!text){ nearMeStatus.hidden = true; nearMeStatus.textContent = ''; nearMeStatus.classList.remove('error'); return; }
nearMeStatus.hidden = false;
nearMeStatus.textContent = text;
nearMeStatus.classList.toggle('error', !!isError);
}

function renderNearMeResults(items){
resultCount.innerHTML = '離你最近的 <b>' + items.length + '</b> 個站牌：';
var html = '<div class="near-me-results">' + items.map(function(item){
var distText = item.dist >= 1000 ? (item.dist/1000).toFixed(1) + ' 公里' : Math.round(item.dist) + ' 公尺';
return '<div class="near-me-item" role="button" tabindex="0" data-name="' + escapeHtml(item.name) + '">' +
'<div class="near-me-item-main"><b>' + escapeHtml(item.name) + '</b>' +
(item.routeLabel ? '<span class="near-me-item-route">' + escapeHtml(item.routeLabel) + '</span>' : '') +
'</div><div class="near-me-item-dist">約 ' + distText + '</div></div>';
}).join('') + '</div>';
resultList.innerHTML = html;
resultList.querySelectorAll('.near-me-item').forEach(function(el){
function activate(){
input.value = el.getAttribute('data-name');
updateClearBtn();
doSearch();
}
el.addEventListener('click', activate);
el.addEventListener('keydown', function(e){
if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
});
});
}

nearMeBtn.addEventListener('click', function(){
if(!('geolocation' in navigator)){
setNearMeStatus('這個瀏覽器不支援定位功能', true);
return;
}
nearMeBtn.disabled = true;
setNearMeStatus('正在取得你的位置...');
trackEvent('校車查詢：找我附近的站');

navigator.geolocation.getCurrentPosition(function(pos){
var userLat = pos.coords.latitude, userLng = pos.coords.longitude;

loadStopsCoords().then(function(coords){
var codes = Object.keys(coords);
if(!codes.length){
setNearMeStatus('目前還沒有站牌座標資料，這個功能暫時無法使用', true);
nearMeBtn.disabled = false;
return;
}

var withDist = codes.map(function(code){
var c = coords[code];
var routesForStop = flatStops.filter(function(s){ return s.code === code; });
var routeLabel = routesForStop.map(function(r){ return r.routeName; })
.filter(function(v, i, arr){ return arr.indexOf(v) === i; }) // 去重
.join('、');
return { code: code, name: c.name, lat: c.lat, lng: c.lng, routeLabel: routeLabel,
dist: haversineDistance(userLat, userLng, c.lat, c.lng) };
}).sort(function(a, b){ return a.dist - b.dist; }).slice(0, 5);

setNearMeStatus(null);
renderNearMeResults(withDist);
trackEvent('校車查詢：找我附近的站成功');
nearMeBtn.disabled = false;
}).catch(function(){
setNearMeStatus('目前還沒有站牌座標資料，這個功能暫時無法使用', true);
trackEvent('校車查詢：找我附近的站失敗', { reason: 'no_coords_data' });
nearMeBtn.disabled = false;
});
}, function(err){
nearMeBtn.disabled = false;
if(err.code === err.PERMISSION_DENIED){
setNearMeStatus('需要允許定位權限才能使用這個功能，可以到瀏覽器設定重新開啟權限', true);
}else{
setNearMeStatus('無法取得目前位置，請稍後再試', true);
}
trackEvent('校車查詢：找我附近的站失敗', { reason: 'geolocation_error_' + err.code });
}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});

function render(query){
resultList.innerHTML = '';
var q = (query||'').trim();
var isInitialLoad = !q;
var matchedRoutes = [];

if(!q){
ROUTES.forEach(function(route){
matchedRoutes.push({route:route, matchedStopCodes:{}, showAll:false, routeNameMatch:false});
});
} else {
/* Fuse 模糊搜尋站點 */
var stopHits = stopFuse.search(q);
var routeHits = routeFuse.search(q);

var routeMatchedByCode = {}; // routeNo -> {stopCode: true}
var routeNameMatched = {}; // routeNo -> true

stopHits.forEach(function(hit){
var routeNo = hit.item.routeNo;
if(!routeMatchedByCode[routeNo]) routeMatchedByCode[routeNo] = {};
routeMatchedByCode[routeNo][hit.item.code] = true;
});
routeHits.forEach(function(hit){
routeNameMatched[hit.item.no] = true;
});

ROUTES.forEach(function(route){
var hasStopMatch = routeMatchedByCode[route.no] && Object.keys(routeMatchedByCode[route.no]).length > 0;
var hasRouteNameMatch = !!routeNameMatched[route.no];
if(hasStopMatch || hasRouteNameMatch){
matchedRoutes.push({
route: route,
matchedStopCodes: routeMatchedByCode[route.no] || {},
showAll: hasRouteNameMatch,
routeNameMatch: hasRouteNameMatch
});
}
});

var QUESTION_WORDS = /(幾點|有沒有|請問|哪裡|哪班|哪一班|怎麼搭|要搭|可以搭|有車嗎|有沒有車|想搭|想坐|要坐|坐哪|搭哪|到.*的車|.*的車|附近|站牌|公車站|站在哪|在哪裡|在哪|去.*怎麼走|要怎麼去)/g;

function stripQuestionWords(text){
var cleaned = text.trim();
// 先移除常見問句開頭/結尾贅字，保留中間的地名關鍵字
cleaned = cleaned.replace(/^(請問|想問一下|不好意思|)/g, '');
cleaned = cleaned.replace(/(有車到|幾點|有沒有車|有沒有|要怎麼搭|怎麼搭|可以搭嗎|可以搭|有車嗎|要坐哪|坐哪|搭哪班|哪一班|哪班車|在哪裡|在哪|附近有沒有|附近|站牌|的車站|的公車站|的站|的車|嗎[?？]?$|呢[?？]?$|[?？]+$)/g, '');
cleaned = cleaned.trim();
return cleaned || text.trim(); // 如果清空了，退回原始輸入
}

/* ---- AI 語意搜尋（規則式清洗後仍找不到結果時才觸發） ---- */
var AI_PROXY_URL = "https://fudan-ai-proxy.whatasmalls.workers.dev";
var aiHint = document.getElementById('aiHint');
var aiRequestToken = 0; // 避免使用者已經改變輸入後，舊的 AI 回應還跑回來蓋掉畫面
var AI_CACHE_KEY = 'fd_ai_search_cache_v1';
var AI_CACHE_MAX_AGE = 1000 * 60 * 60 * 24 * 14; // 快取 14 天

// 把真實路線名稱整理成精簡清單，讓 AI 從「真實存在」的名稱裡挑，而不是憑空生成
var ROUTE_NAME_LIST = ROUTES.map(function(r){ return r.name; }).join('、');

// 從 266 個站牌名稱裡，抽取常見的路名/社區/地標關鍵字（使用者常打這些，而非路線名稱本身）
// 用共用函式庫（js/ai-shared.js），跟首頁 AI 助手共用同一套抽取邏輯
var LANDMARK_KEYWORD_LIST = FdAiShared.buildLandmarkKeywords(flatStops).join('、');

// AI 關鍵字快取，用共用的 TTL 快取工具（js/ai-shared.js）
var aiKeywordCache = FdAiShared.createTTLCache(AI_CACHE_KEY, AI_CACHE_MAX_AGE);
function getCachedKeywords(rawQuery){
return aiKeywordCache.get(rawQuery);
}
function setCachedKeywords(rawQuery, keywords){
aiKeywordCache.set(rawQuery, keywords);
}

function setAiHint(html, mode){
// mode: 'loading' | 'success' | 'error' | null
if(!html){ aiHint.hidden = true; aiHint.innerHTML = ''; aiHint.className = 'ai-hint'; return; }
aiHint.hidden = false;
aiHint.className = 'ai-hint' + (mode ? ' ' + mode : '');
var icon = mode === 'error'
? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>';
aiHint.innerHTML = '<span class="ai-spark">' + icon + '</span>' + html;
}

// 回傳 { keywords: string[] } 或 { error: true }（區分「AI 也找不到」跟「呼叫失敗」）
async function askAIKeywords(rawQuery){
try{
var res = await fetch(AI_PROXY_URL, {
method: 'POST',
headers: {'Content-Type':'application/json'},
body: JSON.stringify({
contents: [{ role:'user', parts:[{ text:
'這是使用者在「復旦高中校車路線查詢」頁面輸入的句子，一般的模糊比對沒有找到結果。' +
'目前系統收錄的所有校車路線名稱如下（僅供你判斷使用者可能指的是哪一條，不代表答案只能是這些名稱之一）：' +
ROUTE_NAME_LIST + '。' +
'另外，站牌資料中常見的路名、社區、地標關鍵字如下（這些是真實存在於資料庫中的詞，優先從中挑選符合的）：' +
LANDMARK_KEYWORD_LIST + '。' +
'請從使用者句子中萃取出最多 3 個可能的地名、路名、社區名、建築物名稱關鍵字，依可能性排序，' +
'優先選擇上面清單中出現過的詞；如果都不吻合，才萃取句子中你判斷最相關的詞，' +
'每個關鍵字 2 到 6 個字（例如：龍潭、金陵路、大江購物中心）。' +
'只回傳一個 JSON 陣列字串，例如 ["龍潭","龍潭國小"]，不要加任何說明文字、不要用 markdown code block。' +
'若真的無法判斷任何關鍵字，回傳空陣列 []。' +
'使用者輸入：「' + rawQuery + '」'
}]}]
})
});
if(!res.ok) return { error: true };
var data = await res.json();
var candidate = data.candidates && data.candidates[0];
var parts = candidate && candidate.content && candidate.content.parts;
if(!parts) return { error: true };
var text = parts.map(function(p){ return p.text || ''; }).join('').trim();
text = text.replace(/^```json\s*|\s*```$/g, '').trim(); // 保險起見去掉可能的 code block 包裝
var keywords;
try{ keywords = JSON.parse(text); }catch(e){ keywords = text ? [text] : []; }
if(!Array.isArray(keywords)) keywords = [];
keywords = keywords.filter(function(k){ return typeof k === 'string' && k.trim(); }).map(function(k){ return k.trim(); });
return { keywords: keywords };
}catch(e){
return { error: true };
}
}

function searchKeyword(keyword){
var stopHits = stopFuse.search(keyword);
var routeHits = routeFuse.search(keyword);
return stopHits.length > 0 || routeHits.length > 0;
}

function trackEvent(name, props){
try{ if(window.plausible) window.plausible(name, props ? { props } : undefined); }catch(e){}
}

function tryAISemanticSearch(rawQuery, cleanedQuery){
var myToken = ++aiRequestToken;
setAiHint('AI 正在理解你的問題...', 'loading');
trackEvent('校車查詢：AI 語意搜尋觸發');

var cached = getCachedKeywords(rawQuery);
var resultPromise = cached ? Promise.resolve({ keywords: cached }) : askAIKeywords(rawQuery);

resultPromise.then(function(result){
if(myToken !== aiRequestToken) return; // 使用者已經輸入別的東西了，這次結果作廢

if(result.error){
setAiHint('AI 助手暫時無法使用，可以換個關鍵字，或試試輸入路名/社區名的一部分。', 'error');
trackEvent('校車查詢：AI 呼叫失敗');
return;
}

var keywords = result.keywords || [];
if(!cached && keywords.length){ setCachedKeywords(rawQuery, keywords); }

var matched = null;
for(var i = 0; i < keywords.length; i++){
if(keywords[i] === cleanedQuery) continue;
if(searchKeyword(keywords[i])){ matched = keywords[i]; break; }
}

if(!matched){
setAiHint(null); // AI 也幫不上忙，維持原本的「找不到」畫面（這是合理的「真的沒有」結果）
trackEvent('校車查詢：AI 也找不到');
return;
}

render(matched);
setAiHint('AI 為你理解成「<b>' + escapeHtml(matched) + '</b>」，以下是相關結果：', 'success');
trackEvent('校車查詢：AI 成功理解', { keyword: matched });
});
}

function doSearch(){
var raw = input.value;
var cleaned = stripQuestionWords(raw);
render(cleaned);
setAiHint(null);
if(raw.trim()){ trackEvent('校車查詢：執行搜尋'); }
if(cleaned && resultList.querySelector('.empty-state')){
tryAISemanticSearch(raw, cleaned);
}
}

/* ---- 即時建議下拉選單：打字時立刻顯示可能符合的站名/路名，不用等按下搜尋 ---- */
var acList = document.getElementById('autocompleteList');
var acItems = [];
var acActiveIndex = -1;

function buildAutocompleteSuggestions(q){
if(!q || q.length < 1) return [];
var seen = {};
var results = [];
stopFuse.search(q).slice(0, 8).forEach(function(r){
var name = r.item.name;
if(seen[name]) return;
seen[name] = true;
results.push({ label: name, tag: '站牌', fill: name });
});
routeFuse.search(q).slice(0, 4).forEach(function(r){
var name = r.item.name;
if(seen[name]) return;
seen[name] = true;
results.push({ label: name, tag: '路線', fill: name });
});
return results.slice(0, 6);
}

function renderAutocomplete(items){
acItems = items;
acActiveIndex = -1;
acList.innerHTML = '';
if(!items.length){ hideAutocomplete(); return; }
items.forEach(function(item, i){
var li = document.createElement('li');
li.setAttribute('role', 'option');
li.setAttribute('aria-selected', 'false');
li.id = 'ac-item-' + i;
li.innerHTML = '<span class="ac-tag">' + item.tag + '</span><span>' + escapeHtml(item.label) + '</span>';
li.addEventListener('mousedown', function(e){ e.preventDefault(); selectAutocompleteItem(item); });
acList.appendChild(li);
});
acList.hidden = false;
input.setAttribute('aria-expanded', 'true');
}

function hideAutocomplete(){
acList.hidden = true;
acList.innerHTML = '';
acItems = [];
acActiveIndex = -1;
input.setAttribute('aria-expanded', 'false');
input.removeAttribute('aria-activedescendant');
}

function moveAutocompleteActive(delta){
if(!acItems.length) return;
acActiveIndex = (acActiveIndex + delta + acItems.length) % acItems.length;
Array.prototype.forEach.call(acList.children, function(li, i){
li.classList.toggle('active', i === acActiveIndex);
li.setAttribute('aria-selected', i === acActiveIndex ? 'true' : 'false');
});
input.setAttribute('aria-activedescendant', 'ac-item-' + acActiveIndex);
}

function selectAutocompleteItem(item){
input.value = item.fill;
hideAutocomplete();
updateClearBtn();
doSearch();
}

render(stripQuestionWords(input.value));

/* 下拉重新整理（Pull to refresh）：手機使用者熟悉的手勢，
   在頁面最頂端往下拉超過門檻值就重新整理，方便快速拿到最新校車資料 */
(function(){
var indicator = document.createElement('div');
indicator.id = 'fd-pull-refresh';
indicator.setAttribute('aria-hidden', 'true');
indicator.style.cssText = 'position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--navy-deep,#16274a);color:#fff;font-size:0.8rem;z-index:150;transition:height .15s ease;';
indicator.textContent = '↓ 放開重新整理';
document.body.appendChild(indicator);

var startY = null, currentDy = 0, tracking = false;
var THRESHOLD = 70;

document.addEventListener('touchstart', function(e){
if(window.scrollY <= 0){
startY = e.touches[0].clientY;
tracking = true;
}
}, { passive: true });

document.addEventListener('touchmove', function(e){
if(!tracking || startY === null) return;
currentDy = e.touches[0].clientY - startY;
if(currentDy > 0 && window.scrollY <= 0){
var height = Math.min(currentDy * 0.5, 70);
indicator.style.height = height + 'px';
indicator.textContent = height >= THRESHOLD ? '↑ 放開重新整理' : '↓ 下拉重新整理';
}
}, { passive: true });

document.addEventListener('touchend', function(){
if(!tracking) return;
tracking = false;
var shouldRefresh = currentDy * 0.5 >= THRESHOLD;
indicator.style.height = '0px';
currentDy = 0;
startY = null;
if(shouldRefresh){
indicator.textContent = '重新整理中...';
indicator.style.height = '40px';
location.reload();
}
});
})();

var themeToggle = document.getElementById('themeToggle');
if(themeToggle){
themeToggle.setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
themeToggle.addEventListener('click', function(){
var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
if(isDark){
document.documentElement.removeAttribute('data-theme');
try{ localStorage.setItem('theme', 'light'); }catch(e){}
} else {
document.documentElement.setAttribute('data-theme', 'dark');
try{ localStorage.setItem('theme', 'dark'); }catch(e){}
}
themeToggle.setAttribute('aria-pressed', !isDark ? 'true' : 'false');
});
}
})();
</script>
</body></html>
