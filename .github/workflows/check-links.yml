name: Check broken links

on:
  schedule:
    - cron: '7 2 * * 1'  # 每週一台灣時間早上10點
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # 開／更新／關閉「失效連結」issue

jobs:
  check-links:
    runs-on: ubuntu-24.04  # 固定版本：ubuntu-latest 10/19 起會換成 Ubuntu 26，避免無人看管的自動排程突然壞掉
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check broken links
        run: python scripts/check_broken_links.py

      - name: Open GitHub Issue if broken links found
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            // 腳本中途失敗沒產生報告時，不要在這一步再報錯一次
            if (!fs.existsSync('link_check_report.json')) { core.warning('沒有產生 link_check_report.json'); return; }
            const report = JSON.parse(fs.readFileSync('link_check_report.json', 'utf8'));
            const { owner, repo } = context.repo;
            // 同時只保留一個「失效連結」issue：有就更新內容，沒有失效連結時自動關閉
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'broken-link' });
            const existing = open.data[0];
            if (report.brokenCount > 0) {
              let body = `## 失效連結報告（${report.checkedAt.slice(0, 10)}）\n\n`;
              for (const b of report.broken) {
                const why = b.status ? `HTTP ${b.status}` : `連不上（${b.error || '逾時'}）`;
                body += `- **${b.title}**（${b.date || ''}）: ${b.url} — ${why}\n`;
              }
              const title = `🔗 發現 ${report.brokenCount} 個失效連結`;
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: ['broken-link'] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: `${report.checkedAt.slice(0, 10)} 重新檢查 ${report.totalChecked} 個連結，都正常，自動關閉。` });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
