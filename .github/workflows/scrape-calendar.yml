name: Scrape school calendar

on:
  schedule:
    - cron: '0 3 * * 1'  # 每週一台灣時間早上11點（校曆不常變，不用太頻繁）
  workflow_dispatch:

jobs:
  scrape-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pdfplumber

      - name: Scrape calendar
        run: python scripts/scrape_calendar.py

      - name: 字型補字（新內容出現字型沒收錄的字就重新產生）
        continue-on-error: true
        run: |
          pip install fonttools brotli
          python scripts/build_fonts.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 分開 add，一個檔案不存在（例如成功時不會有 calendar_debug.json）
          # 不會連累其他真的存在的檔案沒被 stage 到。
          git add calendar.json 2>/dev/null || true
          git add calendar_debug.json 2>/dev/null || true
          git add fonts/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 自動更新校曆（或除錯資訊）"
          git push
