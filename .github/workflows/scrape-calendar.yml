name: Scrape school calendar

on:
  schedule:
    - cron: '0 3 * * 1'  # 每週一台灣時間早上11點（校曆不常變，不用太頻繁）
  workflow_dispatch:

jobs:
  scrape-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests pdfplumber

      - name: Scrape calendar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 暫時性除錯：之前 7 次執行都在 2~3 秒內失敗、且 Python 內部的
          # try/except（連 import 都包進去了）完全沒機會寫出任何除錯檔案，
          # 代表問題可能是 shell 層級或連 Python 解譯器本身都沒真正跑起來
          # ——所以這裡改成在 shell 層級直接把所有輸出、真正的結束代碼都
          # 存下來。GitHub Actions 預設用 `bash -e` 執行多行 run，一旦
          # python 那行失敗，會直接中止整個 step，後面的 echo/cat/exit 0
          # 根本沒機會執行，calendar_run_log.txt 也就永遠不會被寫完整
          # ——這正是前一版診斷徹底失敗的原因。這裡先 set +e 關掉這個行為。
          # 問題排除後這整段都要還原成單純的
          # `run: python scripts/scrape_calendar.py`。
          set +e
          which python python3
          python --version
          python3 --version
          pwd
          ls -la scripts/
          python scripts/scrape_calendar.py > calendar_run_log.txt 2>&1
          SCRIPT_EXIT=$?
          echo "EXIT_CODE=$SCRIPT_EXIT" >> calendar_run_log.txt
          cat calendar_run_log.txt
          exit 0

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json calendar_debug.json calendar_progress.json calendar_run_log.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 自動更新校曆（或除錯資訊）"
          git push
