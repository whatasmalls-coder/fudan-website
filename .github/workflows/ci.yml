name: CI 資料驗證

# 每次 push 到 main、或開 pull request 時都會自動執行，
# 結果會顯示在 GitHub 該次 commit 旁邊的 ✅/❌ 圖示，
# 也可以在 repo 首頁的 Actions 分頁看到完整紀錄。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-24.04  # 固定版本：ubuntu-latest 10/19 起會換成 Ubuntu 26，避免無人看管的自動排程突然壞掉
    steps:
      - name: 取得 repo 內容
        uses: actions/checkout@v5

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 驗證 news.json 與校車路線資料格式
        run: python scripts/validate_data.py

      - name: 檢查站內資源路徑是否有失效引用（例如刪檔案後忘記清引用）
        run: python scripts/check_local_asset_refs.py

      - name: 校曆 PDF 解析規則（被換行切開的活動要黏回去、獨立活動不能誤黏）
        run: python scripts/test_scrape_calendar.py

      # 下面兩項「沒同步」時，push 後的「字型補字」workflow 會自動重新產生並 commit，
      # 所以只顯示黃色提醒、不讓這次檢查變紅色。
      - name: 預先寫進 HTML 的路線／校曆／公告是否跟資料同步
        run: |
          python scripts/build_static_html.py --check || \
            echo "::warning title=預先寫入內容未同步::請執行 python scripts/build_static_html.py（字型補字 workflow 也會自動補上）"

      - name: 字型是否收錄了頁面上所有的字
        run: |
          pip install -q fonttools brotli
          python scripts/build_fonts.py --check || \
            echo "::warning title=字型需要重新產生::請執行 python scripts/build_fonts.py（字型補字 workflow 也會自動補上）"
