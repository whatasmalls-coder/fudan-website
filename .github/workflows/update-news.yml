name: 自動更新最新消息

on:
  schedule:
    # 每小時第 17 分。GitHub 的免費排程常常被跳過：設每 2 小時時實際約 6～8 小時才跑一次，
    # 改成每小時是為了讓實際更新間隔縮短。沒有新公告時不會 commit，AI 摘要那邊也會直接跳過。
    - cron: '17 * * * *'
  workflow_dispatch: {}   # 也可以在 GitHub 網頁上手動點「Run workflow」立刻跑一次

permissions:
  contents: write   # 讓這個 workflow 有權限 commit / push 回這個 repo

jobs:
  update-news:
    runs-on: ubuntu-24.04  # 固定版本：ubuntu-latest 10/19 起會換成 Ubuntu 26，避免無人看管的自動排程突然壞掉
    steps:
      - name: 取得 repo 內容
        uses: actions/checkout@v5

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 抓取官網最新公告並更新 news.json（同時更新 sitemap.xml 日期）
        run: python scripts/update_news.py

      - name: 把最新公告寫進首頁 HTML（讓 Google 讀得到、打開就有內容）
        continue-on-error: true
        run: python scripts/build_static_html.py

      - name: 字型補字（新內容出現字型沒收錄的字就重新產生）
        continue-on-error: true
        run: |
          pip install fonttools brotli
          python scripts/build_fonts.py

      - name: 確認所有頁面引用的檔案都存在（避免推上指向已刪除字型的頁面）
        run: python scripts/check_local_asset_refs.py

      - name: 如果有變動就 commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- news.json sitemap.xml llms.txt fonts/ sw.js '*.html')" ]; then
            echo "沒有變動，不需要 commit。"
          else
            git add news.json sitemap.xml llms.txt fonts/ sw.js '*.html'
            git commit -m "自動更新最新消息 ($(date -u +'%Y-%m-%d'))"
            git pull --rebase   # 同時有別的 commit 推上來時先接上，避免 push 被拒絕
            git push
          fi
