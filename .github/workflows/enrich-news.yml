name: Enrich news announcements

# 10/9 依站長決定關閉自動執行：摘要沒有顯示在網站上，卻會用掉公車 AI 搜尋共用的 Gemini 免費額度。
# 需要時仍可在 GitHub 網頁上手動按「Run workflow」。要恢復自動，把下面註解掉的 workflow_run 打開即可。
on:
  # workflow_run:
  #   workflows: ["自動更新最新消息"]
  #   types:
  #     - completed
  workflow_dispatch:

# 公告更新和 AI 摘要都會改 news.json：排隊一個一個跑，避免兩個同時 push 互相衝突
# （10/7 手動觸發剛好撞上排程，兩個 AI 摘要同時改 news.json，其中一個 rebase 衝突失敗）
concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-24.04  # 固定版本：ubuntu-latest 10/19 起會換成 Ubuntu 26，避免無人看管的自動排程突然壞掉
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # 「自動更新最新消息」每小時跑一次，但大多時候沒有新公告、也沒有 commit。
      # 那種時候就不用再去學校網站抓一輪公告頁、也不用呼叫 AI，直接結束。
      # （手動按 Run workflow 時照常執行）
      - name: 這次有新公告嗎？
        if: github.event_name == 'workflow_run'
        run: |
          subject="$(git log -1 --format=%s)"
          echo "最新 commit：$subject"
          case "$subject" in
            自動更新最新消息*) echo "有新公告，繼續。" ;;
            *) echo "沒有新公告，這次跳過。"; echo "SKIP=1" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-python@v6
        if: env.SKIP != '1'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.SKIP != '1'
        run: pip install requests beautifulsoup4

      # 免費：預設走網站的 Cloudflare Worker（Gemini）。
      # 如果之後在 repo 的 Settings → Secrets 加了 GEMINI_API_KEY，就會改成直接呼叫 Gemini API。
      - name: Enrich news
        if: env.SKIP != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/enrich_news.py

      - name: Commit changes
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "🤖 AI 加工公告摘要"
          git pull --rebase   # 同時有別的 commit 推上來時先接上，避免 push 被拒絕
          git push
