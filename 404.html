<style>
@font-face{font-family:'Noto Sans TC';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/NotoSansTC-400.woff2') format('woff2')}
@font-face{font-family:'Noto Sans TC';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/NotoSansTC-700.woff2') format('woff2')}
@font-face{font-family:'Noto Sans TC Fallback';src:local('PingFang TC'),local('Microsoft JhengHei'),local('Noto Sans CJK TC'),local('Heiti TC');ascent-override:88%;descent-override:12%;line-gap-override:0%}
:root{--navy-deep:#0e1a30;--navy:#16274a;--dawn:#d4a24c;--dawn-text:#8f6424;--paper:#f6f3ec;--paper-dim:#eae5d8;--ink:#20242e;--slate:#5a6072;--line:rgba(20,30,55,0.12)}
[data-theme="dark"]{--paper:#0f1826;--paper-dim:#182338;--ink:#eae7dd;--slate:#c2c8d6;--line:rgba(232,228,216,0.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Noto Sans TC Fallback',sans-serif;line-height:1.7;transition:background-color .3s ease,color .3s ease}
header{background:var(--navy-deep);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand-name{font-weight:700;font-size:1rem}
.brand-sub{font-size:0.68rem;letter-spacing:0.08em;color:rgba(255,255,255,0.6)}
.theme-toggle{background:none;border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.icon-moon{display:none}[data-theme="dark"] .icon-sun{display:none}[data-theme="dark"] .icon-moon{display:block}
main{max-width:560px;margin:0 auto;padding:96px 24px 120px;text-align:center}
.code{font-size:5rem;font-weight:700;color:var(--dawn-text);margin:0;line-height:1}
h1{font-size:1.4rem;margin:16px 0 8px}
p{color:var(--slate);margin:0 0 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:4px;text-decoration:none;font-weight:600;font-size:0.92rem}
.btn-primary{background:var(--dawn);color:var(--navy-deep)}
.btn-ghost{background:var(--paper-dim);color:var(--ink);border:1px solid var(--line)}
footer{text-align:center;padding:24px;color:var(--slate);font-size:0.8rem}
</style>
</head>
<body>
<header>
<a class="brand" href="/"><div><div class="brand-name">復旦高中</div><div class="brand-sub">FUDAN SENIOR HIGH SCHOOL</div></div></a>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深色模式">
<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
</button>
</header>
<main>
<p class="code">404</p>
<h1>這個頁面不存在</h1>
<p>可能是網址打錯了，或是頁面已經搬家。要不要回首頁看看，或直接查校車路線？</p>
<div class="actions">
<a class="btn btn-primary" href="/">回首頁</a>
<a class="btn btn-ghost" href="/bus-search/">校車路線查詢</a>
</div>
</main>
<footer>© 2026 復旦高中 Fudan Senior High School</footer>
<script>
(function(){
var themeToggle = document.getElementById('themeToggle');
var themeColorMeta = document.querySelector('meta[name="theme-color"]');
function syncThemeColor(isDark){
if(themeColorMeta) themeColorMeta.setAttribute('content', isDark ? '#0e1a30' : '#f6f3ec');
}
syncThemeColor(document.documentElement.getAttribute('data-theme') === 'dark');
themeToggle.setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
themeToggle.addEventListener('click', function(){
var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
if(isDark){
document.documentElement.removeAttribute('data-theme');
try{ localStorage.setItem('theme', 'light'); }catch(e){}
} else {
document.documentElement.setAttribute('data-theme', 'dark');
try{ localStorage.setItem('theme', 'dark'); }catch(e){}
}
syncThemeColor(!isDark);
themeToggle.setAttribute('aria-pressed', !isDark ? 'true' : 'false');
});
})();
</script>
</body>
</html>
